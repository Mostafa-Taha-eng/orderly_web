<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orderly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="pricing">

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></span>
        Orderly
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home"></a></li>
        <li><a href="about.html" data-i18n="nav.aboutProject"></a></li>
        <li><a href="about-us.html" data-i18n="nav.aboutUs"></a></li>
        <li><a href="pricing.html" data-i18n="nav.pricing"></a></li>
        <li><a href="contact.html" data-i18n="nav.contact"></a></li>
      </ul>
      <div class="nav-actions">
        <div class="lang-switcher">
          <button class="lang-btn" type="button" data-i18n-aria="common.langSwitcher">
            <span class="lang-btn-label">🇸🇦 العربية</span>
            <span>▾</span>
          </button>
          <div class="lang-dropdown"></div>
        </div>
        <button class="theme-toggle" type="button" data-i18n-aria="common.themeToggle" aria-pressed="false">
          <span class="icon-sun">☀</span>
          <span class="icon-moon">🌙</span>
        </button>
        <a href="index.html#download" class="btn btn-primary" data-i18n="nav.getStarted"></a>
        <button class="menu-toggle" type="button" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="pricing.heroTitle"></h1>
      <p data-i18n="pricing.heroDesc"></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="pricing-toggle-wrap">
        <span class="active" data-billing="monthly" data-i18n="pricing.monthly"></span>
        <button class="billing-toggle" type="button" aria-label="Toggle billing"></button>
        <span data-billing="yearly" data-i18n="pricing.yearly"></span>
      </div>

      <div class="pricing-grid">
        <!-- Starter -->
        <div class="pricing-card">
          <h3 data-i18n="pricing.starterName"></h3>
          <p class="plan-desc" data-i18n="pricing.starterDesc"></p>
          <div class="pricing-price">
            <span class="currency">$</span>
            <span class="amount" data-monthly="29" data-yearly="24">29</span>
            <span class="period" data-i18n="pricing.period"></span>
          </div>
          <p class="pricing-users" data-i18n="pricing.starterUsers"></p>
          <ul class="pricing-features">
            <li data-i18n="pricing.starterF1"></li>
            <li data-i18n="pricing.starterF2"></li>
            <li data-i18n="pricing.starterF3"></li>
            <li data-i18n="pricing.starterF4"></li>
          </ul>
          <a href="contact.html" class="btn btn-outline btn-block" data-i18n="pricing.choosePlan"></a>
        </div>

        <!-- Professional -->
        <div class="pricing-card featured">
          <span class="pricing-badge" data-i18n="pricing.proBadge"></span>
          <h3 data-i18n="pricing.proName"></h3>
          <p class="plan-desc" data-i18n="pricing.proDesc"></p>
          <div class="pricing-price">
            <span class="currency">$</span>
            <span class="amount" data-monthly="79" data-yearly="65">79</span>
            <span class="period" data-i18n="pricing.period"></span>
          </div>
          <p class="pricing-users" data-i18n="pricing.proUsers"></p>
          <ul class="pricing-features">
            <li data-i18n="pricing.proF1"></li>
            <li data-i18n="pricing.proF2"></li>
            <li data-i18n="pricing.proF3"></li>
            <li data-i18n="pricing.proF4"></li>
            <li data-i18n="pricing.proF5"></li>
          </ul>
          <a href="contact.html" class="btn btn-primary btn-block" data-i18n="pricing.choosePlan"></a>
        </div>

        <!-- Enterprise -->
        <div class="pricing-card">
          <h3 data-i18n="pricing.enterpriseName"></h3>
          <p class="plan-desc" data-i18n="pricing.enterpriseDesc"></p>
          <div class="pricing-price">
            <span class="currency">$</span>
            <span class="amount" data-monthly="199" data-yearly="165">199</span>
            <span class="period" data-i18n="pricing.period"></span>
          </div>
          <p class="pricing-users" data-i18n="pricing.enterpriseUsers"></p>
          <ul class="pricing-features">
            <li data-i18n="pricing.enterpriseF1"></li>
            <li data-i18n="pricing.enterpriseF2"></li>
            <li data-i18n="pricing.enterpriseF3"></li>
            <li data-i18n="pricing.enterpriseF4"></li>
            <li data-i18n="pricing.enterpriseF5"></li>
          </ul>
          <a href="contact.html" class="btn btn-outline btn-block" data-i18n="pricing.contactSales"></a>
        </div>
      </div>

      <p class="pricing-note" data-i18n="pricing.note"></p>
    </div>
  </section>

  <section class="cta-banner">
    <div class="container">
      <div class="cta-inner">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.desc"></p>
        <a href="index.html#download" class="btn btn-primary btn-lg" data-i18n="cta.button"></a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a href="index.html" class="logo">
            <span class="logo-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></span>
            Orderly
          </a>
          <p data-i18n="footer.desc"></p>
          <div class="social-links">
            <a href="#" class="social-link">f</a>
            <a href="#" class="social-link">in</a>
            <a href="#" class="social-link">𝕏</a>
            <a href="#" class="social-link">Li</a>
          </div>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.product"></h4>
          <ul>
            <li><a href="index.html#features" data-i18n="footer.features"></a></li>
            <li><a href="index.html#download" data-i18n="download.label"></a></li>
            <li><a href="pricing.html" data-i18n="footer.pricing"></a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.company"></h4>
          <ul>
            <li><a href="about.html" data-i18n="footer.aboutProject"></a></li>
            <li><a href="about-us.html" data-i18n="footer.aboutUs"></a></li>
            <li><a href="contact.html" data-i18n="footer.contact"></a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.support"></h4>
          <ul>
            <li><a href="contact.html" data-i18n="footer.help"></a></li>
            <li><a href="privacy.html" data-i18n="footer.privacy"></a></li>
            <li><a href="terms.html" data-i18n="footer.terms"></a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© 2026 Orderly. <span data-i18n="footer.rights"></span></span>
      </div>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
