  <main id="main-content">
  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="contact.heroTitle"></h1>
      <p data-i18n="contact.heroDesc"></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="contact-tabs">
        <button type="button" class="contact-tab active" data-tab="report" data-i18n="contact.tabReport"></button>
        <button type="button" class="contact-tab" data-tab="direct" data-i18n="contact.tabDirect"></button>
        <button type="button" class="contact-tab" data-tab="social" data-i18n="contact.tabSocial"></button>
      </div>

      <!-- Report Issue -->
      <div class="contact-panel active contact-form-wrap" data-panel="report">
        <h2 data-i18n="contact.reportTitle"></h2>
        <p data-i18n="contact.reportDesc"></p>
        <form data-contact-form novalidate>
          <div class="form-success" data-i18n="contact.successMsg"></div>
          <div class="form-group">
            <label for="issue-type" data-i18n="contact.issueLabel"></label>
            <select id="issue-type" required>
              <option value="" data-i18n="contact.issuePlaceholder"></option>
              <option value="bug" data-i18n="contact.issueBug"></option>
              <option value="account" data-i18n="contact.issueAccount"></option>
              <option value="payment" data-i18n="contact.issuePayment"></option>
              <option value="other" data-i18n="contact.issueOther"></option>
            </select>
            <span class="form-error" data-i18n="contact.errorRequired"></span>
          </div>
          <div class="form-group">
            <label for="report-name" data-i18n="contact.nameLabel"></label>
            <input type="text" id="report-name" required data-min="2" data-i18n-placeholder="contact.namePlaceholder">
            <span class="form-error" data-i18n="contact.errorRequired"></span>
          </div>
          <div class="form-group">
            <label for="report-email" data-i18n="contact.emailFormLabel"></label>
            <input type="email" id="report-email" required data-pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" data-i18n-placeholder="contact.emailPlaceholder">
            <span class="form-error" data-i18n="contact.errorEmail"></span>
          </div>
          <div class="form-group">
            <label for="report-message" data-i18n="contact.messageLabel"></label>
            <textarea id="report-message" required data-min="10" data-i18n-placeholder="contact.messagePlaceholder"></textarea>
            <span class="form-error" data-i18n="contact.errorMin"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="contact.submitBtn"></button>
        </form>
      </div>

      <!-- Direct Support -->
      <div class="contact-panel contact-form-wrap" data-panel="direct">
        <h2 data-i18n="contact.directTitle"></h2>
        <p data-i18n="contact.directDesc"></p>
        <form data-contact-form novalidate>
          <div class="form-success" data-i18n="contact.successMsg"></div>
          <div class="form-group">
            <label for="direct-name" data-i18n="contact.nameLabel"></label>
            <input type="text" id="direct-name" required data-min="2" data-i18n-placeholder="contact.namePlaceholder">
            <span class="form-error" data-i18n="contact.errorRequired"></span>
          </div>
          <div class="form-group">
            <label for="direct-email" data-i18n="contact.emailFormLabel"></label>
            <input type="email" id="direct-email" required data-pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" data-i18n-placeholder="contact.emailPlaceholder">
            <span class="form-error" data-i18n="contact.errorEmail"></span>
          </div>
          <div class="form-group">
            <label for="direct-subject" data-i18n="contact.subjectLabel"></label>
            <input type="text" id="direct-subject" required data-min="3" data-i18n-placeholder="contact.subjectPlaceholder">
            <span class="form-error" data-i18n="contact.errorRequired"></span>
          </div>
          <div class="form-group">
            <label for="direct-message" data-i18n="contact.messageLabel"></label>
            <textarea id="direct-message" required data-min="10" data-i18n-placeholder="contact.messagePlaceholder"></textarea>
            <span class="form-error" data-i18n="contact.errorMin"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="contact.submitBtn"></button>
        </form>
      </div>

      <!-- Social Channels -->
      <div class="contact-panel" data-panel="social">
        <div class="section-header" style="margin-bottom:2rem">
          <h2 class="section-title" data-i18n="contact.socialTitle"></h2>
          <p class="section-desc" data-i18n="contact.socialDesc"></p>
        </div>
        <div class="social-contact-grid">
          <div class="social-contact-card">
            <div class="sc-icon">📘</div>
            <h3 data-i18n="contact.fbTitle"></h3>
            <p data-i18n="contact.fbDesc"></p>
            <a href="https://facebook.com" target="_blank" rel="noopener" class="btn btn-outline btn-block" data-i18n="contact.fbBtn"></a>
          </div>
          <div class="social-contact-card">
            <div class="sc-icon">💬</div>
            <h3 data-i18n="contact.waTitle"></h3>
            <p data-i18n="contact.waDesc"></p>
            <a href="https://wa.me/966500000000" target="_blank" rel="noopener" class="btn btn-primary btn-block" data-i18n="contact.waBtn"></a>
          </div>
          <div class="social-contact-card">
            <div class="sc-icon">✉️</div>
            <h3 data-i18n="contact.emailTitle"></h3>
            <p data-i18n="contact.emailDesc"></p>
            <a href="mailto:hello@orderly.app" class="btn btn-outline btn-block" data-i18n="contact.emailBtn"></a>
          </div>
        </div>
      </div>
    </div>
  </section>

            Orderly
